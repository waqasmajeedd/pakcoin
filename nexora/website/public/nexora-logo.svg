<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#F4B728" />
      <stop offset="100%" stop-color="#E5A812" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagon -->
  <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" stroke="url(#goldGrad)" stroke-width="4" fill="#0C0E14" />
  
  <!-- Inner Circuit Nodes -->
  <circle cx="50" cy="4" r="3" fill="#FFE082" />
  <circle cx="90" cy="26" r="3" fill="#F4B728" />
  <circle cx="90" cy="74" r="3" fill="#F4B728" />
  <circle cx="50" cy="96" r="3" fill="#E5A812" />
  <circle cx="10" cy="74" r="3" fill="#E5A812" />
  <circle cx="10" cy="26" r="3" fill="#FFE082" />

  <!-- N Stylized Geometric Monogram -->
  <path d="M30 70 V30 L70 70 V30" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="50" cy="50" r="5" fill="url(#cyanGrad)" />
</svg>
