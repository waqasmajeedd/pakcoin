<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#092618" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020804" stop-opacity="1"/>
    </radialGradient>

    <!-- Cyber Gold & Emerald Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="50%" stop-color="#FFA751"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#00D26A"/>
      <stop offset="100%" stop-color="#008744"/>
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0083B0"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#14281E"/>
      <stop offset="50%" stop-color="#0B1A12"/>
      <stop offset="100%" stop-color="#050C08"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Outer Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGlow)"/>

  <!-- Outer Cyber Tech Ring -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.9"/>
  <circle cx="250" cy="250" r="214" fill="none" stroke="url(#neonEmerald)" stroke-width="2" stroke-dasharray="14 10" opacity="0.7"/>

  <!-- Orbital Nodes -->
  <circle cx="250" cy="24" r="5" fill="#FFE259" filter="url(#ambientLight)"/>
  <circle cx="250" cy="476" r="5" fill="#FFE259" filter="url(#ambientLight)"/>
  <circle cx="24" cy="250" r="5" fill="#00FFA3" filter="url(#ambientLight)"/>
  <circle cx="476" cy="250" r="5" fill="#00FFA3" filter="url(#ambientLight)"/>

  <!-- Inner Cyber Hexagon Shield -->
  <polygon points="250,56 414,151 414,341 250,436 86,341 86,151" 
           fill="url(#shieldGrad)" 
           stroke="url(#neonEmerald)" 
           stroke-width="5" 
           filter="url(#ambientLight)"/>

  <!-- Inner Inset Hexagon -->
  <polygon points="250,78 392,160 392,324 250,406 108,324 108,160" 
           fill="none" 
           stroke="url(#goldGrad)" 
           stroke-width="1.5" 
           stroke-dasharray="8 6" 
           opacity="0.5"/>

  <!-- Futuristic Monogram: The "P" & "K" Quantum Emblem -->
  <!-- Left Stem of P -->
  <path d="M 172 135 L 214 135 L 214 365 L 172 365 Z" 
        fill="url(#neonEmerald)" 
        filter="url(#coreGlow)"/>

  <!-- Upper Loop of P -->
  <path d="M 214 135 L 295 135 C 345 135 375 160 375 205 C 375 250 345 275 295 275 L 214 275 Z 
           M 214 175 L 214 235 L 290 235 C 315 235 330 225 330 205 C 330 185 315 175 290 175 Z" 
        fill="url(#goldGrad)" 
        fill-rule="evenodd" 
        filter="url(#ambientLight)"/>

  <!-- Dynamic Energy Slice / Dynamic Wing of K/A -->
  <polygon points="250,265 345,365 295,365 214,280" 
           fill="url(#neonEmerald)" 
           opacity="0.95" 
           filter="url(#ambientLight)"/>

  <!-- Central Core Flare -->
  <circle cx="214" cy="205" r="8" fill="#FFFFFF" filter="url(#coreGlow)"/>

  <!-- Modern Sleek Branding Arc -->
  <text x="250" y="465" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="900" font-size="19" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="7">PAK COIN</text>
</svg>
